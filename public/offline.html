<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e131b" />
    <title>Offline — Louis Peter</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e131b;
        color: #f4ede2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        margin: 0 0 1rem;
        font-weight: 600;
      }
      p {
        max-width: 32ch;
        margin: 0 auto 1.5rem;
        line-height: 1.6;
        color: #c7c0b6;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: #ff7f50;
        color: #0e131b;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't cached yet. Reconnect to the internet and try again.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
